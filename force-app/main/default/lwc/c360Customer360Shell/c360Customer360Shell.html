<template>
    <div class="hub-shell">
        <aside class="hub-side">
            <div class="hub-brand"><span class="hub-mark">C3</span><span>{shell.brand}</span></div>
            <nav class="hub-nav" aria-label="Customer 360">
                <template for:each={navItems} for:item="item">
                    <button key={item.id} type="button" class={item.itemClass} data-view={item.targetView} data-account-id={item.targetAccountId} aria-current={item.ariaCurrent} onclick={handleNav}>
                        <template if:true={item.isHome}>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path></svg>
                        </template>
                        <template if:true={item.isAlertCentre}>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 4 3.5 19h17L12 4Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path><path d="M12 10v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>
                        </template>
                        <template if:true={item.isCrossSell}>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>
                        </template>
                        <template if:true={item.isAnalytics}>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 19V10M12 19V5M19 19v-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>
                        </template>
                        <template if:true={item.isCustomers}>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="9" cy="9" r="3" stroke="currentColor" stroke-width="1.8"></circle><path d="M4 19c.6-2.4 2.5-4 5-4s4.4 1.6 5 4M16.2 15c1.8.3 3.2 1.5 3.8 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path><circle cx="17" cy="9" r="2.2" stroke="currentColor" stroke-width="1.8"></circle></svg>
                        </template>
                        <template if:true={item.isReports}>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3.5h7l5 5V20a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path><path d="M14 3.5V9h5.5" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path></svg>
                        </template>
                        <template if:true={item.isSettings}>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"></circle><path d="M12 3.5v2.2M12 18.3v2.2M3.5 12h2.2M18.3 12h2.2M6 6l1.6 1.6M16.4 16.4 18 18M18 6l-1.6 1.6M7.6 16.4 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>
                        </template>
                        <span>{item.label}</span>
                    </button>
                </template>
            </nav>
            <div class="hub-side-date">{shell.navDate}</div>
        </aside>
        <div class="hub-main">
            <header class="hub-bar">
                <h1 class="hub-product">{shell.product}</h1>
                <div class="hub-search">
                    <input type="search" aria-label="Search portfolios and alerts" placeholder={shell.searchPlaceholder}>
                </div>
                <div class="hub-user">
                    <button type="button" class="hub-bell" data-label="Notifications" onclick={handleChrome} aria-label="Notifications">&#128276;</button>
                    <span class="hub-avatar">{shell.userInitials}</span>
                    <span>
                        <span class="hub-user-name">{shell.userName}</span><br>
                        <span class="hub-user-role">{shell.userRole}</span>
                    </span>
                    <button type="button" class="hub-gear" data-label="Settings" onclick={handleChrome} aria-label="Settings">&#9881;</button>
                </div>
            </header>

            <template if:true={isHome}>
                <c-c360-home-page account-ids={homeAccountIds} onnavigate={handleNavigate}></c-c360-home-page>
            </template>
            <template if:true={isAlerts}>
                <c-c360-alerts-centre account-ids={alertAccountIds} onnavigate={handleNavigate}></c-c360-alerts-centre>
            </template>
            <template if:true={isChurn}>
                <div class="ehome-page">
                    <div class="ehome-top">
                        <div class="ehome-crumbs">{churnCrumbs}</div>
                        <button type="button" class="ehome-back" onclick={handleHome}>{churnBack}</button>
                    </div>
                    <div class="ehome-title-row">
                        <div>
                            <h2 class="ehome-account">{selectedName}</h2>
                            <p class="ehome-meta">{churnMeta}</p>
                        </div>
                        <div class="ehome-tools">
                            <span class="ehome-synced">{churnChrome.lastSynced}</span>
                            <template for:each={churnActions} for:item="action">
                                <button key={action.id} type="button" class={action.actionClass} data-label={action.label} onclick={handleChrome}>{action.label}</button>
                            </template>
                        </div>
                    </div>
                    <template if:true={showChurnInsights}>
                        <div class="ehome-children">
                            <c-c360-churn-alert-notification></c-c360-churn-alert-notification>
                            <c-c360-churn-metric-tiles></c-c360-churn-metric-tiles>
                            <c-c360-churn-current-status></c-c360-churn-current-status>
                            <c-c360-identified-risk-signals></c-c360-identified-risk-signals>
                            <c-c360-identified-expansion-opportunities></c-c360-identified-expansion-opportunities>
                            <c-c360-performance-and-trends></c-c360-performance-and-trends>
                        </div>
                    </template>
                    <template if:false={showChurnInsights}>
                        <p class="hub-empty">No churn insights for this AccountId in the preview mock.</p>
                    </template>
                </div>
            </template>
            <template if:true={isCrossSell}>
                <div class="rbs-page">
                    <div class="rbs-top">
                        <div class="rbs-crumbs">{crossSellCrumbs}</div>
                        <button type="button" class="rbs-back" onclick={handleHome}>{crossSellBack}</button>
                    </div>
                    <div class="rbs-title-row">
                        <div>
                            <h1 class="rbs-account">{selectedName} <span class="rbs-badge">{crossSellChrome.badge}</span></h1>
                            <p class="rbs-meta">{crossSellMeta}</p>
                        </div>
                        <div class="rbs-tools">
                            <span class="rbs-synced">{crossSellChrome.lastSynced}</span>
                            <button type="button" class="rbs-export" data-label={crossSellChrome.exportLabel} onclick={handleChrome}>{crossSellChrome.exportLabel}</button>
                            <button type="button" class="rbs-initiate" data-label={crossSellChrome.initiateLabel} onclick={handleChrome}>{crossSellChrome.initiateLabel}</button>
                        </div>
                    </div>
                    <div class="rbs-filter">
                        <span class="rbs-mid-label">{crossSellChrome.midLabel}</span>
                        <span class="rbs-mid">{crossSellChrome.midValue}</span>
                    </div>
                    <template if:true={showCrossSellInsights}>
                        <div class="rbs-children">
                            <c-c360-merchant-business-case-header></c-c360-merchant-business-case-header>
                            <c-c360-last12-months-summary></c-c360-last12-months-summary>
                            <c-c360-business-case-annual-estimate></c-c360-business-case-annual-estimate>
                            <c-c360-cross-sell-detail account-id={accountId}></c-c360-cross-sell-detail>
                        </div>
                    </template>
                    <template if:false={showCrossSellInsights}>
                        <p class="hub-empty">No cross-sell recommendations for this AccountId in the preview mock.</p>
                    </template>
                </div>
            </template>
            <template if:true={isAnalytics}>
                <section class="hub-empty">
                    <h2>Analytics</h2>
                    <p>This slice has no Analytics page.</p>
                </section>
            </template>
            <template if:true={isCustomers}>
                <section class="hub-empty">
                    <h2>Customers</h2>
                    <p>This slice has no Customers page.</p>
                </section>
            </template>
        </div>
    </div>
</template>
