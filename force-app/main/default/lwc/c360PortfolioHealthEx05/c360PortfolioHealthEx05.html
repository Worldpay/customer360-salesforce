<template>
    <article class="c360-module panel">
        <div class="panel-header">
            <lightning-icon icon-name="utility:heart" size="x-small"></lightning-icon>
            <h2>{title}</h2>
        </div>
        <div class="panel-body">
            <div class="health-grid">
                <template lwc:if={interactive}>
                    <button type="button" class="health-tile" data-health="Healthy" onclick={handleHealthClick}>
                        <span>Healthy</span><strong class="good-text">{health.healthy}</strong>
                    </button>
                    <button type="button" class="health-tile" data-health="Watch" onclick={handleHealthClick}>
                        <span>Watch</span><strong class="watch-text">{health.watch}</strong>
                    </button>
                    <button type="button" class="health-tile" data-health="At risk" onclick={handleHealthClick}>
                        <span>At risk</span><strong class="risk-text">{health.atRisk}</strong>
                    </button>
                </template>
                <template lwc:else>
                    <div><span>Healthy</span><strong class="good-text">{health.healthy}</strong></div>
                    <div><span>Watch</span><strong class="watch-text">{health.watch}</strong></div>
                    <div><span>At risk</span><strong class="risk-text">{health.atRisk}</strong></div>
                </template>
            </div>
            <h3>Cross-sell pipeline</h3>
            <template for:each={pipelineRows} for:item="row">
                <div key={row.name} class="pipeline">
                    <span>{row.name} <b>{row.detail}</b></span>
                    <i><em style={row.barStyle}></em></i>
                    <strong>{row.value}</strong>
                </div>
            </template>
        </div>
    </article>
</template>
