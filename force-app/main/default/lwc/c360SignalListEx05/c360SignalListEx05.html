<template>
    <div class="signal-list">
        <template for:each={displaySignals} for:item="signal">
            <div key={signal.id} class={signal.rowClass}>
                <div class="row-tag"><span class={signal.badgeClass}>{signal.category}</span></div>
                <div class="signal-copy row-body">
                    <strong>{signal.title}</strong>
                    <p>{signal.description}</p>
                </div>
                <template lwc:if={signal.done}>
                    <div class="signal-actions row-actions"><span class="status-pill">{signal.statusLabel}</span></div>
                </template>
                <template lwc:else>
                    <div class="signal-actions row-actions">
                        <button class="button primary" type="button" data-id={signal.id} onclick={handleAction}>Action</button>
                        <button class="button" type="button" data-id={signal.id} onclick={handleDismiss}>Dismiss</button>
                    </div>
                </template>
            </div>
        </template>
        <template lwc:if={noSignals}>
            <p class="empty">No signals in queue.</p>
        </template>
    </div>
</template>
