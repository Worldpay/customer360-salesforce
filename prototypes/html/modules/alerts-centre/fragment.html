<section class="alerts-page" data-module="alerts-centre">
  <div class="alerts-crumbs"></div>
  <button type="button" class="alerts-back"></button>
  <div class="alerts-title-row">
    <h2 class="alerts-title"></h2>
    <div>
      <span class="alerts-updated"></span>
      <button type="button" class="alerts-export"></button>
    </div>
  </div>
  <div class="alerts-filters">
    <input class="alerts-search" type="search" aria-label="Filter alerts">
    <label>Priority <select class="alerts-select" aria-label="Priority"><option>All</option></select></label>
    <label>Status <select class="alerts-select" aria-label="Status"><option>All</option></select></label>
    <button type="button" class="alerts-save">Save Filters</button>
  </div>
  <p class="alerts-summary"></p>
  <table class="alerts-table">
    <thead>
      <tr>
        <th>Account name</th><th>Churn score</th><th>Threshold</th><th>Alert date</th>
        <th>Suppression</th><th>RM task</th><th>Email</th><th>Status</th><th>Status</th>
      </tr>
    </thead>
    <tbody class="alerts-rows"></tbody>
  </table>
  <p class="alerts-note"></p>
</section>
