<template>
    <div class="signal-list">
        <template for:each={openSignals} for:item="signal">
            <div key={signal.id} class="signal-row">
                <span class={signal.badgeClass}>{signal.category}</span>
                <div class="signal-copy">
                    <strong>{signal.title}</strong>
                    <p>{signal.description}</p>
                    <p class="pathway">Recommended pathway: <b>{signal.pathway}</b></p>
                </div>
                <div class="signal-actions">
                    <button class="button primary" data-id={signal.id} onclick={handleAction}>Action</button>
                    <button class="button" data-id={signal.id} onclick={handleDismiss}>Dismiss</button>
                </div>
            </div>
        </template>
        <template lwc:if={noOpenSignals}>
            <div class="empty">All signals actioned or dismissed.</div>
        </template>
    </div>
</template>
