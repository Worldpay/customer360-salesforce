<template>
    <article class="c360-module panel">
        <div class="panel-header urgent">
            <lightning-icon icon-name="utility:warning" size="x-small"></lightning-icon>
            <h2>{title}</h2>
            <span>{subtitle}</span>
        </div>
        <div class="action-list">
            <template for:each={displayItems} for:item="item">
                <div key={item.id} class="action">
                    <div class="row-tag"><span class={item.severityClass}>{item.severityLabel}</span></div>
                    <div class="row-body">
                        <strong>{item.heading}</strong>
                        <p>{item.body}</p>
                    </div>
                    <div class="row-actions">
                        <button class={item.buttonClass} data-account={item.accountName} data-source={item.sourceView} onclick={handleReview}>{item.buttonLabel}</button>
                    </div>
                </div>
            </template>
            </div>
            </article>
            </template>
