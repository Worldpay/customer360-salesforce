<template>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="logo">
                <span class="logo-mark">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m12 3 8 4.5-8 4.5L4 7.5zM4 12l8 4.5 8-4.5M4 16.5 12 21l8-4.5" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path></svg>
                </span>
                <span>{page.brandName}</span>
            </div>
            <nav class="navigation" aria-label="Main navigation">
                <template for:each={navigation} for:item="item">
                    <button key={item.id} type="button" class={item.itemClass} data-nav={item.id} data-label={item.label} onclick={handleNav}>
                        <template if:true={item.isHome}>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path></svg>
                        </template>
                        <template if:true={item.isBell}>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 16V10a6 6 0 1 1 12 0v6l1.5 2h-15zM10 19a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path></svg>
                        </template>
                        <template if:true={item.isLayers}>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m12 3 8 4.5-8 4.5L4 7.5zM4 12l8 4.5 8-4.5M4 16.5 12 21l8-4.5" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path></svg>
                        </template>
                        <template if:true={item.isChart}>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 19V5M4 19h16M8 15v-4M12 15V8M16 15v-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>
                        </template>
                        <template if:true={item.isUsers}>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M16 19v-1.2A3.8 3.8 0 0 0 12.2 14H7.8A3.8 3.8 0 0 0 4 17.8V19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path><circle cx="10" cy="8" r="3" stroke="currentColor" stroke-width="1.8"></circle></svg>
                        </template>
                        <template if:true={item.isFile}>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3h7l4 4v14H7zM14 3v5h5" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path></svg>
                        </template>
                        <template if:true={item.isGear}>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"></circle><path d="M12 3v2.2M12 18.8V21M4.9 6.5l1.6 1.6M17.5 15.9l1.6 1.6M3 12h2.2M18.8 12H21M4.9 17.5l1.6-1.6M17.5 8.1l1.6-1.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>
                        </template>
                        <span>{item.label}</span>
                    </button>
                </template>
            </nav>
            <div class="sidebar-footer">
                <button type="button" class="user-card" data-label="Account menu" onclick={handleChrome}>
                    <span class="avatar">{page.userInitials}</span>
                    <span>
                        <span class="user-name">{page.userName}</span>
                        <span class="user-role">{page.userRole}</span>
                    </span>
                </button>
            </div>
        </aside>
        <div class="main-shell">
            <main class="page">
                <header class="page-header">
                    <div>
                        <div class="greeting-row">
                            <h1 class="greeting">{page.greeting}</h1>
                            <span class="priority-pill">{page.priorityAlertLabel}</span>
                        </div>
                        <p class="subtitle">{page.subtitle}</p>
                    </div>
                    <div class="header-tools">
                        <span class="updated">{page.updatedLabel}</span>
                        <button type="button" class="select-btn" data-label={page.periodLabel} onclick={handleChrome}>
                            {page.periodLabel}
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                        </button>
                        <div class="header-actions">
                            <button type="button" class="btn" data-label={page.exportLabel} onclick={handleChrome}>
                                {page.exportLabel}
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 4v10M8 10l4 4 4-4M5 19h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                            </button>
                            <button type="button" class="btn btn-brand" data-label={page.analysisLabel} onclick={handleChrome}>
                                {page.analysisLabel}
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 19V5M4 19h16M8 15v-4M12 15V8M16 15v-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>
                            </button>
                        </div>
                    </div>
                </header>
                <c-c360-home-v3-kpi-row></c-c360-home-v3-kpi-row>
                <c-c360-home-v3-portfolio-briefing></c-c360-home-v3-portfolio-briefing>
                <div class="workspace-grid">
                    <c-c360-home-v3-revenue-overview></c-c360-home-v3-revenue-overview>
                    <c-c360-home-v3-todays-focus></c-c360-home-v3-todays-focus>
                </div>
                <c-c360-home-v3-portfolio-accounts></c-c360-home-v3-portfolio-accounts>
                <c-c360-home-v3-churn-signals></c-c360-home-v3-churn-signals>
                <c-c360-home-v3-cross-sell-leads></c-c360-home-v3-cross-sell-leads>
                <c-c360-home-v3-recommended-actions></c-c360-home-v3-recommended-actions>
                <footer class="page-footer">
                    <span>{page.footer.note}</span>
                    <span>{page.footer.date}</span>
                </footer>
            </main>
        </div>
    </div>
</template>
