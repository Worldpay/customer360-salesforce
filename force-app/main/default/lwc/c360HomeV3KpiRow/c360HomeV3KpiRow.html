<template>
    <div class="kpi-row">
        <template for:each={cards} for:item="card">
            <article key={card.key} class="kpi-card">
                <template if:true={card.hasChip}>
                    <span class={card.chipClass}><template if:true={card.showUp}>▲ </template>{card.chip}</span>
                </template>
                <span class="kpi-icon">
                    <template if:true={card.isDollar}>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v18M16 7.5c0-1.8-1.8-3-4-3s-4 1.2-4 3 1.6 2.6 4 3 4 1.3 4 3-1.8 3-4 3-4-1.2-4-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>
                    </template>
                    <template if:true={card.isUsers}>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M16 19v-1.2A3.8 3.8 0 0 0 12.2 14H7.8A3.8 3.8 0 0 0 4 17.8V19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path><circle cx="10" cy="8" r="3" stroke="currentColor" stroke-width="1.8"></circle></svg>
                    </template>
                    <template if:true={card.isUserPlus}>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 19v-1.2A3.8 3.8 0 0 0 11.2 14H7M18 8v6M15 11h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path><circle cx="10" cy="8" r="3" stroke="currentColor" stroke-width="1.8"></circle></svg>
                    </template>
                    <template if:true={card.isRepeat}>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M17 4h3v3M20 7a8 8 0 0 0-13.5 2M7 20H4v-3M4 17a8 8 0 0 0 13.5-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                    </template>
                </span>
                <span class="kpi-label">{card.label}</span>
                <div class="kpi-value-row">
                    <strong class="kpi-value">{card.value}</strong>
                    <template if:true={card.hasNote}><span class={card.noteClass}>{card.note}</span></template>
                </div>
            </article>
        </template>
    </div>
</template>
