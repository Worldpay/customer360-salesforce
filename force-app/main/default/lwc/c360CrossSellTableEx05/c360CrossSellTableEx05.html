<template>
    <article class="c360-module panel table-loading-host">
        <div class="panel-header">
            <lightning-icon icon-name="utility:add" size="x-small"></lightning-icon>
            <h2>{title}</h2>
            <span>{subtitle}</span>
        </div>
        <template lwc:if={isLoading}>
            <div class="table-loading-state">
                <lightning-spinner alternative-text="Loading accounts" size="medium"></lightning-spinner>
            </div>
        </template>
        <template lwc:elseif={error}>
            <p class="table-error">Unable to load cross-sell opportunities.</p>
        </template>
        <template lwc:else>
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Account</th>
                            <th>Product</th>
                            <th>Propensity</th>
                            <th>Est. uplift / yr</th>
                            <th>Top driver</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={rows} for:item="row">
                            <tr key={row.account}>
                                <td><button class="account-link" data-account={row.account} onclick={handleOpenAccount}>{row.account}</button></td>
                                <td>{row.product}</td>
                                <td><span class={row.propensityPillClass}>{row.propensity}</span></td>
                                <td>{row.uplift}</td>
                                <td>{row.driver}</td>
                                <td><button class="button" data-account={row.account} onclick={handleOpenAccount}>Open</button></td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </template>
    </article>
</template>
