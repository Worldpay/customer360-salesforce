<template>
    <template lwc:if={isPortfolio}>
        <div class="portfolio-wrap">
            <div class="filter-bar" role="group" aria-label="Portfolio health filter">
                <template for:each={filterChips} for:item="chip">
                    <button key={chip.filter} type="button" class={chip.className}
                        data-filter={chip.filter} onclick={handleHealthFilter}>{chip.filter}</button>
                </template>
            </div>
            <article class="c360-module panel section-panel table-loading-host">
                <div class="panel-header">
                    <lightning-icon icon-name="standard:account" size="x-small"></lightning-icon>
                    <h2>{portfolioTitle}</h2>
                    <span>{accountCountLabel}</span>
                </div>
                <template lwc:if={isLoading}>
                    <div class="table-loading-state">
                        <lightning-spinner alternative-text="Loading accounts" size="medium"></lightning-spinner>
                    </div>
                </template>
                <template lwc:else>
                <div class="table-scroll">
                    <table>
                        <thead>
                            <tr>
                                <th>Account</th>
                                <th>Industry</th>
                                <th>Revenue</th>
                                <th>Health index</th>
                                <th>Health</th>
                                <th>Last activity</th>
                                <th>Predicted change in transaction count</th>
                                <th>Top cross-sell (product)</th>
                                <th>Top cross-sell (est. net benefit)</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={rows} for:item="account">
                                <tr key={account.id}>
                                    <td>
                                        <button class="account-link" data-account={account.name}
                                            onclick={handleOpenAccount}>{account.name}</button>
                                    </td>
                                    <td>{account.industry}</td>
                                    <td>{account.revenueDisplay}</td>
                                    <td>{account.healthIndex}</td>
                                    <td><span class={account.healthPillClass}>{account.health}</span></td>
                                    <td>{account.lastActivity}</td>
                                    <td class={account.txnClass}>{account.predictedTxnChange}</td>
                                    <td>{account.topCrossSellProduct}</td>
                                    <td class="wp-val">{account.topCrossSellNetBenefit}</td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
                <template lwc:if={showTableExpand}>
                    <div class="table-expand-footer">
                        <button type="button" class="button" onclick={handleShowAllRows}>{expandButtonLabel}</button>
                    </div>
                </template>
                <template lwc:if={showTableCollapse}>
                    <div class="table-expand-footer">
                        <button type="button" class="button" onclick={handleShowPreviewRows}>Show first 5 only</button>
                    </div>
                </template>
                <p class="provenance">{provenance}</p>
                </template>
            </article>
        </div>
    </template>
    <template lwc:else>
        <article class="c360-module panel section-panel table-loading-host">
            <div class="panel-header">
                <lightning-icon icon-name="standard:account" size="x-small"></lightning-icon>
                <h2>{title}</h2>
                <span>{subtitle}</span>
            </div>
            <template lwc:if={isLoading}>
                <div class="table-loading-state">
                    <lightning-spinner alternative-text="Loading accounts" size="medium"></lightning-spinner>
                </div>
            </template>
            <template lwc:else>
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Account</th>
                            <th>Health index</th>
                            <th class="change-col">Change</th>
                            <th>Industry</th>
                            <th>Revenue (monthly)</th>
                            <th>Health</th>
                            <th>Churn risk</th>
                            <th>Last activity</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={rows} for:item="account">
                            <tr key={account.id}>
                                <td>
                                    <button class="account-link" data-account={account.name}
                                        onclick={handleOpenAccount}>{account.name}</button>
                                </td>
                                <td>{account.healthIndex}</td>
                                <td class="change-cell"><span class={account.deltaClass}>{account.healthDelta}</span></td>
                                <td>{account.industry}</td>
                                <td>{account.volume}</td>
                                <td><span class={account.healthPillClass}>{account.health}</span></td>
                                <td><span class={account.riskPillClass}>{account.risk}</span></td>
                                <td>{account.lastActivity}</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
            <template lwc:if={showTableExpand}>
                <div class="table-expand-footer">
                    <button type="button" class="button" onclick={handleShowAllRows}>{expandButtonLabel}</button>
                </div>
            </template>
            <template lwc:if={showTableCollapse}>
                <div class="table-expand-footer">
                    <button type="button" class="button" onclick={handleShowPreviewRows}>Show first 5 only</button>
                </div>
            </template>
            <p class="provenance">{provenance}</p>
            </template>
        </article>
    </template>
</template>
