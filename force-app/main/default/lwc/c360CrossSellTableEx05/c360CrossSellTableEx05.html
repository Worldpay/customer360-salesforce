<template>
    <article class="c360-module panel">
        <div class="panel-header">
            <lightning-icon icon-name="utility:add" size="x-small"></lightning-icon>
            <h2>{title}</h2>
            <span>{subtitle}</span>
        </div>
        <div class="table-scroll">
            <table>
                <thead>
                    <tr>
                        <th>Account</th>
                        <th>Product</th>
                        <th>Propensity</th>
                        <th>Est. uplift / yr</th>
                        <th>Top driver</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={rows} for:item="row">
                        <tr key={row.account}>
                            <td><button class="account-link" data-account={row.account} onclick={handleOpenAccount}>{row.account}</button></td>
                            <td>{row.product}</td>
                            <td><span class={row.propensityPillClass}>{row.propensity}</span></td>
                            <td>{row.uplift}</td>
                            <td>{row.driver}</td>
                            <td><button class="button" data-account={row.account} onclick={handleOpenAccount}>Open</button></td>
                        </tr>
                    </template>
                    </tbody>
                    </table>
                    </div>
                    </article>
                    </template>
