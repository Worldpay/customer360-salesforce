<template>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="logo">
                <span class="logo-mark">{page.brandMark}</span>
                <span class="logo-name">{page.brandName}</span>
            </div>
            <nav class="navigation" aria-label="Main navigation">
                <template for:each={navigation} for:item="item">
                    <button key={item.id} type="button" class={item.itemClass} data-nav={item.id} data-label={item.label} onclick={handleNav}>
                        <span>
                            <template if:true={item.isHome}>
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path></svg>
                            </template>
                            <template if:true={item.isAlert}>
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 4 3 19h18zM12 10v4M12 16.5h.01" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path></svg>
                            </template>
                            <template if:true={item.isSpark}>
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m12 3 1.6 4.8L18 9.5l-4.4 1.7L12 16l-1.6-4.8L6 9.5l4.4-1.7z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path></svg>
                            </template>
                            <template if:true={item.isChart}>
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 19V5M4 19h16M8 15v-3M12 15V8M16 15v-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>
                            </template>
                            <template if:true={item.isUsers}>
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M16 19v-1.2A3.8 3.8 0 0 0 12.2 14H7.8A3.8 3.8 0 0 0 4 17.8V19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path><circle cx="10" cy="8" r="3" stroke="currentColor" stroke-width="1.8"></circle></svg>
                            </template>
                            <template if:true={item.isFile}>
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3h7l4 4v14H7zM14 3v5h5" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path></svg>
                            </template>
                            <template if:true={item.isGear}>
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"></circle><path d="M12 3v2M12 19v2M4.9 6.5l1.5 1.5M17.6 15.8l1.5 1.5M3 12h2M19 12h2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>
                            </template>
                            {item.label}
                        </span>
                        <template if:true={item.hasChevron}>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                        </template>
                    </button>
                </template>
            </nav>
            <p class="sidebar-date">{page.sidebarDate}</p>
        </aside>
        <div class="main-shell">
            <header class="hub-bar">
                <h1 class="hub-title">{page.hubTitle}</h1>
                <div class="hub-tools">
                    <label class="hub-search">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="1.8"></circle><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>
                        <input type="search" placeholder={page.searchPlaceholder} aria-label="Search portfolios and alerts">
                    </label>
                    <button type="button" class="bell" data-label="Notifications" aria-label="Notifications" onclick={handleChrome}>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 16V10a6 6 0 1 1 12 0v6l1.5 2h-15zM10 19a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path></svg>
                        <span class="bell-count">{page.notificationCount}</span>
                    </button>
                    <span class="hub-rule"></span>
                    <button type="button" class="profile" data-label="Account menu" onclick={handleChrome}>
                        <span class="avatar">{page.userInitials}</span>
                        <span><strong>{page.userName}</strong><small>{page.userRole}</small></span>
                    </button>
                    <button type="button" class="apps" data-label="Apps" aria-label="Apps" onclick={handleChrome}>▦</button>
                </div>
            </header>
            <main class="page">
                <c-c360-alerts-v3-page-header></c-c360-alerts-v3-page-header>
                <c-c360-alerts-v3-alert-filters onfilter={handleFilter}></c-c360-alerts-v3-alert-filters>
                <c-c360-alerts-v3-alert-table query={query} status-filter={statusFilter}></c-c360-alerts-v3-alert-table>
            </main>
        </div>
    </div>
</template>
