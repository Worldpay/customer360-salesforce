<template>
    <section class="alert-detail">
        <button class="crumb" onclick={handleBack}>Alert Centre</button>
        <section class="page-heading">
            <div>
                <h1>Alert detail — {detail.account}</h1>
                <p>Score {detail.score}% | ARR {detail.arr} | {detail.merchantCount} merchants</p>
            </div>
            <div class="actions">
                <button class="button" data-action="resolve" onclick={handleAction}>Mark resolved</button>
                <button class="button" data-action="defer" onclick={handleAction}>Defer signal</button>
                <button class="button" data-action="dismiss" onclick={handleAction}>Dismiss</button>
                <button class="button primary" data-action="escalate" onclick={handleAction}>Escalate to manager</button>
            </div>
        </section>

        <div class="two-column">
            <article class="panel">
                <div class="panel-header"><h2>6-month score trajectory</h2></div>
                <div class="chart">
                    <template for:each={trajectoryBars} for:item="bar">
                        <i key={bar.key} class={bar.className} style={bar.style}></i>
                    </template>
                </div>
            </article>
            <article class="panel">
                <div class="panel-header"><h2>Cross-sell intelligence</h2></div>
                <div class="panel-body">
                    <p><strong>Pipeline:</strong> {detail.crossSell.pipeline}</p>
                    <p><strong>Confidence:</strong> {detail.crossSell.confidence}%</p>
                    <ul>
                        <template for:each={detail.crossSell.products} for:item="product">
                            <li key={product}>{product}</li>
                        </template>
                    </ul>
                </div>
            </article>
        </div>

        <article class="panel section-panel">
            <div class="panel-header"><h2>Explainability drivers</h2><span>Manager visibility enabled</span></div>
            <div class="panel-body">
                <template for:each={drivers} for:item="driver">
                    <div key={driver.label} class="driver">
                        <span>{driver.label}</span>
                        <i><em style={driver.widthStyle}></em></i>
                        <b>{driver.impact}</b>
                    </div>
                </template>
            </div>
        </article>

        <article class="panel section-panel">
            <div class="panel-header"><h2>Follow-up and outcome reporting</h2></div>
            <div class="panel-body form-grid">
                <lightning-combobox label="Interaction type" value="Call" options={interactionOptions}></lightning-combobox>
                <lightning-combobox label="Outcome" value="Action scheduled" options={outcomeOptions}></lightning-combobox>
                <lightning-input type="date" label="Next review date"></lightning-input>
                <lightning-textarea label="Evidence / notes" placeholder="Capture client-safe outcome notes for model feedback (BR-004)."></lightning-textarea>
            </div>
        </article>
    </section>
</template>
