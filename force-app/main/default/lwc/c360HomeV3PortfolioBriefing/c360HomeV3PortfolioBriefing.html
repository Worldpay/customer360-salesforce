<template>
    <div class="briefing-stack">
        <section class="briefing">
            <div class="briefing-copy">
                <span class="briefing-mark">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 16V10a6 6 0 1 1 12 0v6l1.5 2h-15zM10 19a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path></svg>
                </span>
                <div>
                    <h2 class="briefing-title">{briefing.title}</h2>
                    <p class="briefing-eyebrow">{briefing.eyebrow}</p>
                </div>
                <p class="briefing-body">{briefing.body}</p>
            </div>
            <svg class="briefing-art" viewBox="0 0 150 72" aria-hidden="true">
                <rect x="78" y="28" width="62" height="36" rx="6" fill="#d9d4ff"></rect>
                <rect x="86" y="36" width="28" height="18" rx="2" fill="#5b4fe0"></rect>
                <circle cx="48" cy="28" r="12" fill="#f3d2c4"></circle>
                <path d="M30 70c2-16 10-22 18-22s16 6 18 22" fill="#6d5ef5"></path>
            </svg>
            <div class="briefing-actions">
                <button type="button" class="btn briefing-dismiss" data-label={briefing.dismissLabel} onclick={handleChrome}>{briefing.dismissLabel}</button>
                <button type="button" class="btn briefing-review" data-label={briefing.reviewLabel} onclick={handleChrome}>{briefing.reviewLabel} ›</button>
            </div>
        </section>
        <section class="churn-banner">
            <div class="churn-banner-copy">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 4 3 19h18zM12 10v4M12 16.5h.01" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path></svg>
                <strong>{churnAlert.title}</strong>
                <span>| {churnAlert.detail}</span>
            </div>
            <div class="churn-banner-meta">
                <span>{churnAlert.when}</span>
                <span class="priority-chip">{churnAlert.priority}</span>
                <button type="button" class="churn-view" data-label={churnAlert.viewLabel} onclick={handleChrome}>{churnAlert.viewLabel}</button>
            </div>
        </section>
    </div>
</template>
