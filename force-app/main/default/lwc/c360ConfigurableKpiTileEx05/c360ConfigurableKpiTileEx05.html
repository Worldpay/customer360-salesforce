<template>
    <section class="c360-module configurable-kpi">
        <template lwc:if={isLoading}>
            <div class="kpi-placeholder" aria-busy="true"></div>
        </template>
        <template lwc:elseif={error}>
            <div class="kpi-error">Unable to load metric</div>
        </template>
        <template lwc:else>
            <c-c360-kpi-tile-ex05
                label={tileLabel}
                value={tileValue}
                detail={tileDetail}
                variant={tileVariant}>
            </c-c360-kpi-tile-ex05>
        </template>
    </section>
</template>
