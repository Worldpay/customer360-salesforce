<template>
    <section class="metrics-grid">
        <template for:each={metrics} for:item="metric">
            <article key={metric.id} class="metric-card">
                <div class="metric-card-top">
                    <span class={metric.iconClass}>
                        <template if:true={metric.isDollar}>
                            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"></circle><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8M12 18V6" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
                        </template>
                        <template if:true={metric.isTarget}>
                            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"></circle><circle cx="12" cy="12" r="6" stroke="currentColor" stroke-width="2"></circle><circle cx="12" cy="12" r="2" stroke="currentColor" stroke-width="2"></circle></svg>
                        </template>
                        <template if:true={metric.isChart}>
                            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 3v16a2 2 0 0 0 2 2h16M7 14l4-4 4 4 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                        </template>
                    </span>
                    <span class="metric-change">{metric.change}</span>
                </div>
                <strong class="metric-value">{metric.value}</strong>
                <span class="metric-label">{metric.label}</span>
                <span class="metric-detail">{metric.detail}</span>
            </article>
        </template>
        <article class="metric-card">
            <div class="metric-card-top">
                <span class="metric-icon metric-icon-orange">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                </span>
                <span class="live-indicator"><i></i> {activity.liveLabel}</span>
            </div>
            <strong class="metric-value">{activity.value}</strong>
            <span class="metric-label">{activity.label}</span>
            <div class="avatar-stack">
                <template for:each={people} for:item="person">
                    <span key={person.id} class={person.avatarClass}>{person.initials}</span>
                </template>
                <span>{overflowLabel}</span>
            </div>
        </article>
    </section>
</template>
