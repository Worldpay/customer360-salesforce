<template>
    <div>
        <div class="section-head">
            <div>
                <h2 class="section-title">{page.title}</h2>
                <p class="focus-count">{remainingLabel}</p>
            </div>
        </div>
        <div class="panel focus-panel">
            <div class="task-list">
                <template for:each={tasks} for:item="task">
                    <div key={task.id} class={task.rowClass}>
                        <label class="task-main">
                            <input type="checkbox" data-task={task.id} checked={task.done} onchange={handleToggle}>
                            <span>
                                <span class="task-title">{task.title}</span>
                                <span class="task-time">{task.time}</span>
                            </span>
                        </label>
                        <span class="task-tools">
                            <template if:true={task.hasPriority}><span class="task-chip">{task.priority}</span></template>
                            <button type="button" class="icon-btn" data-label="Delete task" aria-label="Delete" onclick={handleChrome}>
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 7h14M9 7V5h6v2M8 7l1 12h6l1-12" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path></svg>
                            </button>
                            <button type="button" class="icon-btn quiet" data-label="More" aria-label="More" onclick={handleChrome}>
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="6" r="1.4"></circle><circle cx="12" cy="12" r="1.4"></circle><circle cx="12" cy="18" r="1.4"></circle></svg>
                            </button>
                        </span>
                    </div>
                </template>
            </div>
            <button type="button" class="add-task" data-label={page.addLabel} onclick={handleChrome}>
                {page.addLabel}
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>
            </button>
        </div>
    </div>
</template>
