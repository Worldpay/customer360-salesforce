<template>
    <section>
        <p class="summary">{page.summary}</p>
        <div class="table-wrap">
            <table class="alerts">
                <thead>
                    <tr>
                        <template for:each={columns} for:item="column">
                            <th key={column.key}>{column.label}</th>
                        </template>
                    </tr>
                </thead>
                <tbody>
                    <template if:true={hasRows}>
                        <template for:each={rows} for:item="row">
                            <tr key={row.id}>
                                <td><button type="button" class="account" data-label={row.name} onclick={handleChrome}>{row.name}</button></td>
                                <td class={row.scoreClass}>{row.score}</td>
                                <td>{row.threshold}</td>
                                <td>{row.date}</td>
                                <td>{row.suppression}</td>
                                <td>{row.task}</td>
                                <td>{row.email}</td>
                                <td><span class={row.badgeClass}>{row.status}</span></td>
                                <td><button type="button" class="action" data-label="Action" onclick={handleChrome}>Action</button></td>
                            </tr>
                        </template>
                    </template>
                    <template if:false={hasRows}>
                        <tr><td class="empty" colspan="9">No alerts match this filter.</td></tr>
                    </template>
                </tbody>
            </table>
        </div>
        <p class="logic">{page.logicLead}<strong>{page.logicEmphasis}</strong>{page.logicRest}</p>
    </section>
</template>
