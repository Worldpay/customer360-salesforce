<template>
    <article class="c360-module panel table-loading-host">
        <div class="panel-header">
            <lightning-icon icon-name="utility:trend" size="x-small"></lightning-icon>
            <h2>{title}</h2>
        </div>
        <template lwc:if={isLoading}>
            <div class="table-loading-state">
                <lightning-spinner alternative-text="Loading accounts" size="medium"></lightning-spinner>
            </div>
        </template>
        <template lwc:else>
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Account</th>
                            <th>Predicted risk</th>
                            <th>Txn count vs last year</th>
                            <th>Top driver</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={tableRows} for:item="row">
                            <tr key={row.account}>
                                <td><button class="account-link" data-account={row.account} onclick={handleOpenAccount}>{row.account}</button></td>
                                <td><span class={row.riskPillClass}>{row.risk}</span></td>
                                <td class="negative">{row.txnChange}</td>
                                <td>{row.driver}</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
            <template lwc:if={showTableExpand}>
                <div class="table-expand-footer">
                    <button type="button" class="button" onclick={handleShowAllRows}>{expandButtonLabel}</button>
                </div>
            </template>
            <template lwc:if={showTableCollapse}>
                <div class="table-expand-footer">
                    <button type="button" class="button" onclick={handleShowPreviewRows}>Show first 5 only</button>
                </div>
            </template>
        </template>
    </article>
</template>
