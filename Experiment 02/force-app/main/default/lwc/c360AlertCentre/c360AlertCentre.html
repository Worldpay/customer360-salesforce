<template>
    <section class="alert-centre">
        <section class="page-heading">
            <div>
                <h1>Alert Centre</h1>
                <p>Churn alerts for pilot RM group | IF score &lt; -25% AND RM in pilot → Alert + Task + Email</p>
            </div>
            <span class="pilot-badge">PILOT</span>
        </section>

        <div class="filters">
            <template for:each={statusOptions} for:item="option">
                <button key={option.value} class={option.className} data-status={option.value} onclick={handleFilter}>{option.value}</button>
            </template>
        </div>

        <div class="two-column">
            <article class="panel section-panel">
                <div class="panel-header">
                    <lightning-icon icon-name="utility:warning" size="x-small"></lightning-icon>
                    <h2>Active alerts</h2>
                    <span>{filteredAlerts.length} shown</span>
                </div>
                <div class="table-scroll">
                    <table>
                        <thead>
                            <tr>
                                <th>Account</th>
                                <th>Score</th>
                                <th>Threshold</th>
                                <th>Alert date</th>
                                <th>Suppression</th>
                                <th>RM task</th>
                                <th>Status</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={filteredAlerts} for:item="alert">
                                <tr key={alert.id}>
                                    <td>{alert.account}</td>
                                    <td class="negative">{alert.score}%</td>
                                    <td>{alert.threshold}%</td>
                                    <td>{alert.alertDate}</td>
                                    <td>{alert.suppression}</td>
                                    <td>{alert.rmTask}</td>
                                    <td><span class="status-pill">{alert.status}</span></td>
                                    <td><button class="button primary" data-id={alert.id} onclick={handleOpenAlert}>Open</button></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
                <p class="footnote">1-month suppression per merchant after Defer. Status workflow: New → In Review → Action Scheduled → Suppressed.</p>
            </article>

            <article class="panel">
                <div class="panel-header">
                    <lightning-icon icon-name="utility:add" size="x-small"></lightning-icon>
                    <h2>Cross-selling intelligence</h2>
                </div>
                <div class="panel-body intel">
                    <p><strong>Pipeline value:</strong> GBP 4.8m across pilot accounts</p>
                    <p><strong>Average confidence:</strong> 71%</p>
                    <ul>
                        <li>Smart Routing — Acme Corporation (78%)</li>
                        <li>Tokenisation — InTech Solutions (65%)</li>
                        <li>FX Optimisation Engine — Summit Ventures (62%)</li>
                    </ul>
                </div>
            </article>
        </div>
    </section>
</template>
