<template>
    <article class="c360-module panel section-panel">
        <div class="panel-header">
            <lightning-icon icon-name="standard:account" size="x-small"></lightning-icon>
            <h2>{title}</h2>
            <span>{subtitle}</span>
        </div>
        <div class="table-scroll">
            <table>
                <thead>
                    <tr>
                        <th>Account</th>
                        <th>Health index</th>
                        <th class="change-col">Change</th>
                        <th>Industry</th>
                        <th>Revenue (monthly)</th>
                        <th>Health</th>
                        <th>Churn risk</th>
                        <th>Last activity</th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={rows} for:item="account">
                        <tr key={account.id}>
                            <td>
                                <button class="account-link" data-account={account.name}
                                    onclick={handleOpenAccount}>{account.name}</button>
                            </td>
                            <td>{account.healthIndex}</td>
                            <td class="change-cell"><span class={account.healthClass}>{account.healthDelta}</span></td>
                            <td>{account.industry}</td>
                            <td>{account.volume}</td>
                            <td><span class={account.healthPillClass}>{account.health}</span></td>
                            <td><span class={account.riskPillClass}>{account.risk}</span></td>
                            <td>Today</td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </article>
</template>
