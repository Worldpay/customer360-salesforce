<template>
    <div class="dashboard">
        <header class="global-header">
            <div class="brand">Global Payments <span>Customer 360</span></div>
            <lightning-input class="search" type="search" variant="label-hidden" placeholder="Search accounts, merchants, opportunities..."></lightning-input>
            <div class="user">
                <lightning-icon icon-name="utility:notification" size="x-small"></lightning-icon>
                <span class="avatar">SJ</span>
            </div>
        </header>
        <nav class="app-nav" aria-label="Customer 360 navigation">
            <span class="app-name"><lightning-icon icon-name="standard:account" size="small"></lightning-icon>Customer 360</span>
            <template for:each={navItems} for:item="item">
                <button key={item.value} class={item.className} data-view={item.value} onclick={handleNavigate}>
                    {item.label}
                    <template lwc:if={item.count}><span class="count">{item.count}</span></template>
                </button>
            </template>
        </nav>

        <main class="page-content">
            <template lwc:if={isOverview}>
                <section class="page-heading">
                    <div>
                        <h1>Enterprise Account Hub</h1>
                        <p>Tuesday, 26 August 2026 | 42 accounts | Sarah Jenkins (PILOT)</p>
                    </div>
                    <button class="button" onclick={handleOpenExport}>Export PDF</button>
                </section>
                <div class="material-banner">
                    <lightning-icon icon-name="utility:trend" size="x-small"></lightning-icon>
                    <span>Material changes: 3 accounts moved to At risk this week | Revenue at risk GBP 2.8m</span>
                </div>
                <div class="kpi-grid kpi-grid-6">
                    <c-c360-kpi-tile label="Total accounts" value="42" detail="Enterprise and eCommerce"></c-c360-kpi-tile>
                    <c-c360-kpi-tile label="Composite health index" value="72.4" detail="+0.6 vs last month"></c-c360-kpi-tile>
                    <c-c360-kpi-tile label="Signals to action" value={openSignalCount} detail={openSignalSummary} variant="attention"></c-c360-kpi-tile>
                    <c-c360-kpi-tile label="Open pathways" value="7" detail="2 at risk of slipping"></c-c360-kpi-tile>
                    <c-c360-kpi-tile label="At-risk accounts" value="3" detail="Watch list expanded"></c-c360-kpi-tile>
                    <c-c360-kpi-tile label="Revenue at risk" value="GBP 2.8m" detail="Pilot portfolio"></c-c360-kpi-tile>
                </div>
                <div class="two-column">
                    <article class="panel">
                        <div class="panel-header urgent">
                            <lightning-icon icon-name="utility:warning" size="x-small"></lightning-icon>
                            <h2>Needs action today</h2>
                            <span>Intraday | Daily | Monthly</span>
                        </div>
                        <div class="action-list">
                            <div class="action">
                                <span class="severity now">Intraday</span>
                                <div><strong>Pets at Home - volume down 24% today</strong><p>Possible incident or traffic shift. Brazil and UK gateways affected.</p></div>
                                <button class="button primary" data-account="Pets at Home" onclick={handleOpenAccount}>Review</button>
                            </div>
                            <div class="action">
                                <span class="severity day">Daily</span>
                                <div><strong>Deep Blue Retail - 3-day auth-rate decline</strong><p>Concentrated on 05 do-not-honour decline code.</p></div>
                                <button class="button" data-account="Deep Blue Retail" onclick={handleOpenAccount}>Open</button>
                            </div>
                            <div class="action">
                                <span class="severity month">Monthly</span>
                                <div><strong>Willow Travel - compression risk rising to High</strong><p>Volume down 18% over 60 days; Brazil market under plan.</p></div>
                                <button class="button" data-account="Willow Travel" onclick={handleOpenAccount}>Open</button>
                            </div>
                        </div>
                    </article>
                    <article class="panel">
                        <div class="panel-header">
                            <lightning-icon icon-name="utility:heart" size="x-small"></lightning-icon>
                            <h2>Portfolio health</h2>
                        </div>
                        <div class="panel-body">
                            <div class="health-grid">
                                <div><span>Healthy</span><strong class="good-text">31</strong></div>
                                <div><span>Watch</span><strong class="watch-text">8</strong></div>
                                <div><span>At risk</span><strong class="risk-text">3</strong></div>
                            </div>
                            <h3>Cross-sell pipeline</h3>
                            <div class="pipeline"><span>Revenue Boost <b>6 live opportunities</b></span><i><em style="width:72%"></em></i><strong>GBP 4.1m</strong></div>
                            <div class="pipeline"><span>FX <b>3 live opportunities</b></span><i><em style="width:40%"></em></i><strong>GBP 2.3m</strong></div>
                        </div>
                    </article>
                </div>
                <article class="panel section-panel">
                    <div class="panel-header">
                        <lightning-icon icon-name="utility:priority" size="x-small"></lightning-icon>
                        <h2>My signals</h2>
                        <span>{openSignalCount} open</span>
                    </div>
                    <c-c360-signal-list signals={signals} onsignalaction={handleSignalAction} onsignaldismiss={handleSignalDismiss}></c-c360-signal-list>
                </article>
                <article class="panel section-panel">
                    <div class="panel-header">
                        <lightning-icon icon-name="standard:account" size="x-small"></lightning-icon>
                        <h2>My accounts</h2>
                        <span>Top movers</span>
                    </div>
                    <div class="table-scroll">
                        <table>
                            <thead>
                                <tr>
                                    <th>Account</th>
                                    <th>Health index</th>
                                    <th>Change</th>
                                    <th>Industry</th>
                                    <th>Revenue (monthly)</th>
                                    <th>Health</th>
                                    <th>Churn risk</th>
                                    <th>Pathways</th>
                                    <th>Last activity</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={accounts} for:item="account">
                                    <tr key={account.id}>
                                        <td><button class="account-link" data-account={account.name} onclick={handleOpenAccount}>{account.name}</button></td>
                                        <td>{account.healthIndex}</td>
                                        <td class={account.healthClass}>{account.healthDelta}</td>
                                        <td>{account.industry}</td>
                                        <td>{account.volume}</td>
                                        <td><span class={account.healthClass}>{account.health}</span></td>
                                        <td><span class={account.riskClass}>{account.risk}</span></td>
                                        <td>{account.pathways}</td>
                                        <td>Today</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                    <p class="provenance">Snowflake → Analytics Engine → Salesforce | 15-min refresh</p>
                </article>
            </template>

            <template lwc:if={isAlertCentre}>
                <c-c360-alert-centre onalertselect={handleAlertSelect}></c-c360-alert-centre>
            </template>

            <template lwc:if={isAlertDetail}>
                <c-c360-alert-detail alert-id={selectedAlertId} onback={handleAlertBack} onalertaction={handleAlertAction}></c-c360-alert-detail>
            </template>

            <template lwc:if={isCrossSell}>
                <section class="page-heading"><div><h1>Cross-Sell</h1><p>Revenue Boost is the priority product for this phase</p></div></section>
                <article class="panel">
                    <div class="panel-header"><lightning-icon icon-name="utility:add" size="x-small"></lightning-icon><h2>Open cross-sell opportunities</h2><span>Across your portfolio</span></div>
                    <div class="table-scroll">
                        <table>
                            <thead><tr><th>Account</th><th>Product</th><th>Propensity</th><th>Est. uplift / yr</th><th>Top driver</th><th></th></tr></thead>
                            <tbody>
                                <tr><td><button class="account-link" data-account="Pets at Home" onclick={handleOpenAccount}>Pets at Home</button></td><td>Revenue Boost</td><td><span class="risk">High</span></td><td>GBP 1.4m</td><td>High 05-decline volume</td><td><button class="button" data-account="Pets at Home" onclick={handleOpenAccount}>Open</button></td></tr>
                                <tr><td><button class="account-link" data-account="Northwind Foods" onclick={handleOpenAccount}>Northwind Foods</button></td><td>Revenue Boost</td><td><span class="watch">Medium</span></td><td>GBP 0.7m</td><td>Non-MIT scheme fees</td><td><button class="button" data-account="Northwind Foods" onclick={handleOpenAccount}>Open</button></td></tr>
                                <tr><td><button class="account-link" data-account="Aurora Gaming" onclick={handleOpenAccount}>Aurora Gaming</button></td><td>FX</td><td><span class="watch">Medium</span></td><td>GBP 0.9m</td><td>6-currency settlement</td><td><button class="button" data-account="Aurora Gaming" onclick={handleOpenAccount}>Open</button></td></tr>
                            </tbody>
                        </table>
                    </div>
                </article>
            </template>

            <template lwc:if={isChurn}>
                <section class="page-heading"><div><h1>Churn</h1><p>Predicted volume compression and retraction, 3-6 months ahead</p></div></section>
                <article class="panel">
                    <div class="panel-header"><lightning-icon icon-name="utility:trend" size="x-small"></lightning-icon><h2>Accounts by churn risk</h2></div>
                    <div class="table-scroll">
                        <table>
                            <thead><tr><th>Account</th><th>Predicted risk</th><th>Txn count vs last year</th><th>Top driver</th><th>Recommended pathway</th></tr></thead>
                            <tbody>
                                <tr><td><button class="account-link" data-account="Willow Travel" onclick={handleOpenAccount}>Willow Travel</button></td><td><span class="risk">High</span></td><td class="negative">-18% vs LY</td><td>Brazil market under plan</td><td>Pricing review</td></tr>
                                <tr><td><button class="account-link" data-account="Pets at Home" onclick={handleOpenAccount}>Pets at Home</button></td><td><span class="watch">Medium</span></td><td class="negative">-9% vs LY</td><td>Brazil compression</td><td>Pricing and performance review</td></tr>
                                <tr><td><button class="account-link" data-account="Deep Blue Retail" onclick={handleOpenAccount}>Deep Blue Retail</button></td><td><span class="watch">Medium</span></td><td class="negative">-5% vs LY</td><td>05-decline and servicing</td><td>Service escalation</td></tr>
                            </tbody>
                        </table>
                    </div>
                </article>
            </template>

            <template lwc:if={isPathways}>
                <section class="page-heading"><div><h1>Pathways</h1><p>Track next steps across accounts and functions</p></div></section>
                <div class="scope">
                    <button class={myScopeClass} data-scope="me" onclick={handleScope}>My accounts</button>
                    <button class={teamScopeClass} data-scope="team" onclick={handleScope}>My team</button>
                </div>
                <article class="panel">
                    <div class="panel-header"><lightning-icon icon-name="utility:forward" size="x-small"></lightning-icon><h2>In-progress pathways</h2><span>{scopeLabel}</span></div>
                    <div class="table-scroll">
                        <table>
                            <thead><tr><th>Account</th><th>Pathway</th><th>Stage</th><th>Owning function</th><th>Target date</th><th>Status</th></tr></thead>
                            <tbody>
                                <template for:each={visiblePathways} for:item="pathway">
                                    <tr key={pathway.id}>
                                        <td>{pathway.account}</td>
                                        <td><b>{pathway.name}</b></td>
                                        <td>{pathway.stage}</td>
                                        <td>{pathway.owner}</td>
                                        <td>{pathway.date}</td>
                                        <td><span class={pathway.statusClass}>{pathway.status}</span></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </article>
            </template>

            <template lwc:if={isAccount}>
                <section class="account-highlight">
                    <button class="crumb" data-view="overview" onclick={handleNavigate}>Overview</button>
                    <div class="account-title">
                        <span class="account-icon">{accountInitials}</span>
                        <div>
                            <h1>{selectedAccount.name}</h1>
                            <p>Enterprise | {selectedAccount.industry} | RM: Sarah Jenkins | 18 MIDs</p>
                        </div>
                        <span class={selectedAccount.healthClass}>Health: {selectedAccount.health}</span>
                    </div>
                    <div class="facts">
                        <div><span>Volume (LTM)</span><b>{selectedAccount.volume}</b></div>
                        <div><span>Churn risk</span><b>{selectedAccount.risk}</b></div>
                        <div><span>Health index</span><b>{selectedAccount.healthIndex}</b></div>
                        <div><span>Chargebacks</span><b>0.41%</b></div>
                        <div><span>Open pathways</span><b>{selectedAccount.pathways}</b></div>
                    </div>
                    <div class="account-actions">
                        <button class="button" onclick={handleOpenExport}>Export PowerPoint</button>
                        <span class="hint">Shift+click account links elsewhere to open Salesforce Record Page.</span>
                    </div>
                </section>
                <div class="two-column">
                    <article class="panel">
                        <div class="panel-header"><h2>Processing volume - last 8 months</h2><span>GBP m / month</span></div>
                        <div class="chart"><i></i><i></i><i></i><i></i><i></i><i class="dip"></i><i class="dip short"></i></div>
                    </article>
                    <article class="panel">
                        <div class="panel-header"><h2>Open actions</h2></div>
                        <div class="panel-body">
                            <template for:each={selectedAccountPathways} for:item="pathway">
                                <div key={pathway.id} class="pathway-row">
                                    <div><b>{pathway.name}</b><p>{pathway.stage} | due {pathway.date}</p></div>
                                    <span class={pathway.statusClass}>{pathway.status}</span>
                                </div>
                            </template>
                            <button class="button primary" data-pathway="New pathway" onclick={handleInitiate}>Initiate pathway</button>
                        </div>
                    </article>
                </div>
                <div class="two-column">
                    <article class="panel">
                        <div class="panel-header"><h2>Compression risk drivers</h2><span>Explainability</span></div>
                        <div class="panel-body">
                            <p>Overall risk <b class="watch-text">{selectedAccount.risk}</b>. Drivers contributing to the score:</p>
                            <div class="driver"><span>Volume compression - Brazil market</span><i><em style="width:88%"></em></i><b>+34%</b></div>
                            <div class="driver"><span>Auth-rate dip on 05 decline code</span><i><em style="width:56%"></em></i><b>+21%</b></div>
                            <div class="driver"><span>Servicing tickets rising</span><i><em style="width:32%"></em></i><b>+12%</b></div>
                        </div>
                    </article>
                    <article class="panel">
                        <div class="panel-header"><h2>Revenue Boost opportunity</h2><span>Priority product</span></div>
                        <div class="panel-body opportunity">
                            <span class="risk">High propensity</span>
                            <strong>GBP 1.4m</strong>
                            <p>Estimated uplift per year from eligible declined volume.</p>
                            <button class="button accent" data-pathway="Revenue Boost pitch" onclick={handleInitiate}>Initiate pathway</button>
                        </div>
                    </article>
                </div>
            </template>
        </main>

        <template lwc:if={toastMessage}>
            <button class="toast" onclick={dismissToast}>{toastMessage}</button>
        </template>
        <template lwc:if={showExportModal}>
            <c-c360-export-modal account-name={selectedAccount.name} onclose={handleCloseExport}></c-c360-export-modal>
        </template>
    </div>
</template>
