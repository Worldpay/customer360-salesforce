<template>
    <section class="panel opportunities-panel">
        <header class="panel-header">
            <div>
                <h2>{page.title}</h2>
                <p>{page.subtitle}</p>
            </div>
            <button type="button" class="button button-ghost" data-label={page.viewLabel} onclick={handleChrome}>
                {page.viewLabel}
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
            </button>
        </header>
        <div class="table-wrap">
            <table class="opportunity-table">
                <thead>
                    <tr>
                        <template for:each={columns} for:item="column">
                            <th key={column.key}>{column.label}</th>
                        </template>
                        <th aria-label="Actions"></th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={rows} for:item="row">
                        <tr key={row.id}>
                            <td>
                                <div class="company-cell">
                                    <span class={row.avatarClass}>{row.initials}</span>
                                    <span>
                                        <strong>{row.companyName}</strong>
                                        <small>{row.contactName}</small>
                                    </span>
                                </div>
                            </td>
                            <td><span class={row.stageClass}>{row.stage}</span></td>
                            <td class="value-cell">{row.amount}</td>
                            <td class="muted-cell">{row.closeDate}</td>
                            <td>
                                <div class="confidence">
                                    <span class="confidence-track"><span style={row.confidenceStyle}></span></span>
                                    <strong>{row.confidenceLabel}</strong>
                                </div>
                            </td>
                            <td>
                                <button type="button" class="icon-button" data-label={row.moreLabel} aria-label={row.moreLabel} onclick={handleChrome}>
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="1" fill="currentColor"></circle><circle cx="19" cy="12" r="1" fill="currentColor"></circle><circle cx="5" cy="12" r="1" fill="currentColor"></circle></svg>
                                </button>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </section>
</template>
