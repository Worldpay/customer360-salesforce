<section class="home-page" data-module="home-page">
  <div class="home-hero">
    <div>
      <h2 class="home-greeting"></h2>
      <span class="home-pill"></span>
      <p class="home-subtitle"></p>
    </div>
    <div class="home-tools-wrap">
      <p class="home-updated"></p>
      <div class="home-tools">
        <button type="button" class="home-range"></button>
        <span class="home-tool-list"></span>
      </div>
    </div>
  </div>
  <div class="home-kpis"></div>
  <section class="c360-module c360-churn-alert-notification" data-module="churn-alert-notification">
    <div class="can-body"></div>
  </section>
  <section class="home-table-card">
    <div class="home-table-tools">
      <div class="home-filters"></div>
      <input class="home-search" type="search" aria-label="Filter accounts">
    </div>
    <table class="home-table">
      <thead>
        <tr>
          <th>Account name</th><th>Churn score</th><th>Δ Change</th><th>Risk level</th>
          <th>Churn signal</th><th>Cross-sell leads</th><th>Total lead ACV</th><th>Actions</th>
        </tr>
      </thead>
      <tbody class="home-rows"></tbody>
    </table>
    <p class="home-page-label"></p>
  </section>
  <section class="home-section">
    <div class="home-section-head">
      <h2 class="home-signals-title"></h2>
      <span class="home-signals-badge home-pill"></span>
      <button type="button" class="home-link home-signals-link"></button>
    </div>
    <div class="home-signals"></div>
  </section>
  <section class="home-section">
    <div class="home-section-head">
      <h2 class="home-leads-title"></h2>
      <button type="button" class="home-link home-leads-link"></button>
    </div>
    <div class="home-leads"></div>
  </section>
</section>
