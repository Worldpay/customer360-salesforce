<template>
    <div class="mask" onclick={handleBackdropClick}>
        <div class="modal" role="dialog" aria-modal="true">
            <div class="m-h">
                <lightning-icon icon-name="utility:download" size="x-small" class="ico"></lightning-icon>
                <h2>Export account analysis to PowerPoint</h2>
                <button class="x" onclick={handleClose} aria-label="Close">&times;</button>
            </div>
            <div class="m-b">
                <p class="intro">Select the artefacts to include for <b>{accountName}</b>. Output is an editable, Global Payments-branded deck — not a flat image.</p>
                <template for:each={options} for:item="opt">
                    <label key={opt.id} class="chk">
                        <input type="checkbox" checked={opt.checked} data-id={opt.id} onchange={handleCheckboxChange} />
                        <div>
                            <div class="c-t">{opt.label}</div>
                            <div class="c-d">{opt.desc}</div>
                        </div>
                    </label>
                </template>
                <div class="note">Client-safe: internal-only fields (raw model scores, internal risk classifications) are excluded from the export (BR-005).</div>
            </div>
            <div class="m-f">
                <button class="btn gh-ghost" onclick={handleClose}>Cancel</button>
                <button class="btn wp" onclick={handleGenerate}>Generate deck</button>
            </div>
        </div>
    </div>
</template>
