<template>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="logo">
                <span class="logo-mark">
                    <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                </span>
                <span>{page.brandName}</span>
            </div>
            <nav class="navigation" aria-label="Main navigation">
                <span class="nav-section-label">{page.navSectionLabel}</span>
                <template for:each={navigation} for:item="item">
                    <button key={item.id} type="button" class={item.itemClass} data-nav={item.id} onclick={handleNav}>
                        <template if:true={item.isHouse}>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                        </template>
                        <template if:true={item.isAlert}>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M12 9v4M12 17h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
                        </template>
                        <template if:true={item.isRefresh}>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M8 16H3v5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                        </template>
                        <template if:true={item.isShield}>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path><path d="M12 8v4M12 16h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
                        </template>
                        <template if:true={item.isChart}>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 3v16a2 2 0 0 0 2 2h16M7 14l4-4 4 4 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                        </template>
                        <template if:true={item.isFile}>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path><path d="M14 2v4a2 2 0 0 0 2 2h4M8 18v-2M12 18v-4M16 18v-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
                        </template>
                        <template if:true={item.isSettings}>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 7h-9M14 17H5" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path><circle cx="17" cy="17" r="3" stroke="currentColor" stroke-width="2"></circle><circle cx="7" cy="7" r="3" stroke="currentColor" stroke-width="2"></circle></svg>
                        </template>
                        <span>{item.label}</span>
                        <template if:true={item.showCount}><b>{item.count}</b></template>
                    </button>
                </template>
            </nav>
            <div class="sidebar-insight" aria-hidden="true"></div>
            <div class="sidebar-footer">
                <div class="user-card">
                    <span class="avatar avatar-dark avatar-medium">{page.userInitials}</span>
                    <span>
                        <strong>{page.userName}</strong>
                        <small>{page.userTeam}</small>
                    </span>
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                </div>
            </div>
        </aside>

        <div class="main-shell">
            <header class="topbar">
                <div class="global-search">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"></circle><path d="m21 21-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
                    <input type="search" aria-label="Search workspace" placeholder={page.searchPlaceholder}>
                    <span class="search-shortcut">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                        K
                    </span>
                </div>
                <div class="topbar-actions">
                    <button type="button" class="icon-button" data-label="Open apps" aria-label="Open apps" onclick={handleChrome}>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1" stroke="currentColor" stroke-width="2"></rect><rect width="7" height="7" x="14" y="3" rx="1" stroke="currentColor" stroke-width="2"></rect><rect width="7" height="7" x="14" y="14" rx="1" stroke="currentColor" stroke-width="2"></rect><rect width="7" height="7" x="3" y="14" rx="1" stroke="currentColor" stroke-width="2"></rect></svg>
                    </button>
                    <span class="notification-button">
                        <button type="button" class="icon-button" data-label="Notifications" aria-label="Notifications" onclick={handleChrome}>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
                        </button>
                        <i></i>
                    </span>
                    <button type="button" class="button button-primary" data-label={page.createLabel} onclick={handleChrome}>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M12 5v14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"></path></svg>
                        {page.createLabel}
                    </button>
                </div>
            </header>

            <main class="page">
                <header class="page-header">
                    <div>
                        <span class="date-label">{page.todayLabel}</span>
                        <h1>{page.greeting}</h1>
                        <p>{page.homeSubtitle}</p>
                    </div>
                    <div class="page-actions">
                        <button type="button" class="button button-secondary" data-label={page.filterLabel} onclick={handleChrome}>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3 6h18M7 12h10M10 18h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
                            {page.filterLabel}
                        </button>
                        <button type="button" class="button button-secondary" data-label={page.periodLabel} onclick={handleChrome}>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 2v4M16 2v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path><rect width="18" height="18" x="3" y="4" rx="2" stroke="currentColor" stroke-width="2"></rect><path d="M3 10h18" stroke="currentColor" stroke-width="2"></path></svg>
                            {page.periodLabel}
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                        </button>
                    </div>
                </header>
                <c-c360-home-v2-intelligence></c-c360-home-v2-intelligence>
                <c-c360-home-v2-metric-strip></c-c360-home-v2-metric-strip>
                <div class="content-grid">
                    <c-c360-home-v2-revenue-overview></c-c360-home-v2-revenue-overview>
                    <c-c360-home-v2-todays-focus></c-c360-home-v2-todays-focus>
                </div>
                <c-c360-home-v2-priority-opportunities></c-c360-home-v2-priority-opportunities>
            </main>
        </div>

        <button type="button" class="copilot-button" data-label={page.copilotLabel} aria-label="Open Customer360 AI assistant" onclick={handleChrome}>
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path></svg>
            <span>{page.copilotLabel}</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path><path d="M22 2 11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg>
        </button>
    </div>
</template>
